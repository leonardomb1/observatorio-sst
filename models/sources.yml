version: 2

sources:
  - name: silver
    description: >
      Camada conformada: tipos corretos, dicionarios resolvidos e defeitos de
      origem tratados. Materializada fora do dbt porque concentra logica de
      tratamento das quatro geracoes de layout da CAT.
    schema: silver
    tables:
      - name: acidentes
        description: "Uma linha por CAT, com rotulos completos e campos derivados"
      - name: beneficios_acidentarios
        description: "Concessoes do INSS; usar sempre o filtro acidente_trabalho"

  - name: bronze
    description: "Dados brutos por fonte, fieis a origem"
    schema: bronze
    tables:
      - name: cat
        description: "Microdados de CAT, quatro geracoes de layout normalizadas"
      - name: inss_beneficios
        description: "Concessoes do INSS, somente especies com rotulo de acidente"
      - name: caged_saldo
        description: "Novo CAGED agregado: fluxo de emprego, nao estoque"
      - name: rais_estoque
        description: "RAIS agregada: estoque de vinculos, denominador de taxas"
      - name: aeat_registro
        description: "AEAT: acidentes por situacao do registro; unica fonte oficial do sem CAT"
      - name: aeat_indicadores
        description: "AEAT: incidencia, mortalidade e letalidade oficiais por CNAE"
      - name: ilo_sst_taxas
        description: "Indicador ODS 8.8.1 da OIT, por pais e ano"
      - name: osha_ita
        description: "Form 300A da OSHA por estabelecimento nos Estados Unidos"
      - name: cat_rotulos
        description: "Rotulos longos reconstruidos da geracao 2021 a mai/2023"
      - name: cid10
      - name: cbo
      - name: cnae_classes
      - name: ibge_municipios
      - name: mte_noticias
      - name: nr_norma
      - name: nr_texto
      - name: sst_falhas
