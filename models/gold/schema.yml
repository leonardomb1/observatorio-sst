version: 2

models:
  - name: gold__cobertura_cat_mensal
    description: >
      Cobertura da serie de CAT por ano do acidente e mes de emissao, frente ao
      esperado pelo padrao sazonal e pelo nivel do proprio ano.
    columns:
      - name: status_mes
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ok", "baixo", "lacuna", "ausente", "atipico", "nao_publicado"]

  - name: gold__status_ano
    description: >
      Situacao de cada ano da serie de CAT: consolidado, provisorio ou parcial.
      Todo modelo de CAT do gold carrega ano_status a partir daqui.
    columns:
      - name: ano
        tests: [not_null, unique]
      - name: ano_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["consolidado", "provisorio", "parcial"]
      - name: ano_completo
        description: "Igual a ano_status = consolidado; mantido para o Grafana"
        tests: [not_null]

  - name: gold__acidentes_mensal_uf
    description: >
      Acidentes e obitos por ano, mes e unidade federativa do empregador.
      Usa a UF do empregador porque o campo de UF do acidente vem com rotulos
      trocados na origem, o que foi verificado comparando as distribuicoes.
    columns:
      - name: ano
        tests:
          - not_null
      - name: acidentes
        tests:
          - not_null
      - name: uf
        description: "Nome do estado por extenso, como publicado na CAT"

  - name: gold__acidentes_por_tipo_mensal
    description: "Acidentes por tipo, base do indicador de letalidade relativa"
    columns:
      - name: tipo_acidente
        description: >
          A fonte mudou de layout quatro vezes desde 2018. Este teste falha se
          aparecer categoria nova, em vez de ela entrar silenciosamente nos paineis.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Típico", "Trajeto", "Doença"]

  - name: gold__letalidade_por_tipo
    description: >
      Obitos por 100 mil acidentes, por tipo de acidente, somando apenas os
      anos consolidados listados em anos_incluidos.
    columns:
      - name: tipo_acidente
        tests: [not_null, unique]
      - name: obitos_por_100mil_acidentes
        tests: [not_null]

  - name: gold__beneficios_mensal
    description: >
      Concessoes de beneficios de origem acidentaria por competencia e especie.
      Exclui a especie 36, auxilio-acidente previdenciario, que apesar do rotulo
      nao decorre de acidente do trabalho: incluir a especie 36 superestimaria
      as concessoes de 2023 em 12,5%.
    columns:
      - name: periodo
        tests: [not_null]
      - name: especie_codigo
        tests:
          - accepted_values:
              arguments:
                values: ["91", "92", "93", "94", "95"]

  - name: gold__acidentes_por_municipio
    description: "Acidentes por municipio do empregador, com nome resolvido pelo IBGE"
    columns:
      - name: municipio_codigo
        tests: [not_null]

  - name: gold__taxa_fatal_paises
    description: "Indicador ODS 8.8.1 da OIT, taxa de acidentes fatais por 100 mil"
    columns:
      - name: pais_iso3
        tests: [not_null]
      - name: ano
        tests: [not_null]

  - name: gold__osha_eua_taxas_ano
    description: "TRIR e DART dos Estados Unidos, a partir do Form 300A da OSHA"
    columns:
      - name: ano
        tests: [not_null, unique]

  - name: gold__vinculos_rais_municipio
    description: >
      Estoque de vinculos formais da RAIS por ano e municipio, denominador de
      todas as taxas de incidencia. A unidade federativa vem do dicionario do
      IBGE, e nao do codigo numerico da propria RAIS.
    columns:
      - name: municipio_codigo
        tests: [not_null]
      - name: vinculos_ativos
        tests: [not_null]
      - name: ano
        tests: [not_null]

  - name: gold__taxa_incidencia_municipio
    description: >
      Acidentes e obitos por 100 mil vinculos formais, por municipio. Municipio
      com emprego e sem acidente aparece com taxa zero, e nao ausente. A coluna
      base_suficiente marca denominador abaixo de base_minima vinculos, faixa
      em que a taxa oscila demais para leitura isolada. Cada taxa nomeia o
      denominador: sem sufixo, todos os vinculos; sem_adm_publica, sem a
      divisao CNAE 84 dos dois lados (padrao do app); sem_divisoes_84_88, sem
      administracao publica, educacao, saude e servicos sociais.
    columns:
      - name: municipio_codigo
        tests: [not_null]
      - name: acidentes_por_100mil_vinculos
        tests: [not_null]

  - name: gold__taxa_incidencia_uf
    description: >
      Taxa de incidencia por unidade federativa, somada dos municipios, com a
      contagem de CAT que ficaram fora da taxa por falta de municipio casado.
    columns:
      - name: uf
        tests: [not_null]
      - name: acidentes_por_100mil_vinculos
        tests: [not_null]

  - name: gold__taxa_incidencia_brasil
    description: >
      Serie anual do pais por 100 mil vinculos, unica metrica do observatorio
      comparavel com o indicador 8.8.1 da OIT, que nao publica taxa fatal do
      Brasil desde 2011. Cobre apenas o emprego formal.
    columns:
      - name: ano
        tests: [not_null, unique]
      - name: obitos_por_100mil_vinculos
        tests: [not_null]

  - name: gold__taxa_incidencia_cnae
    description: >
      Taxa de incidencia por classe CNAE. A subclasse da RAIS e truncada em
      quatro digitos e o codigo da CAT recebe zero a esquerda, sem o que as
      atividades agropecuarias sairiam da juncao silenciosamente.
    columns:
      - name: cnae_codigo
        tests: [not_null]
      - name: acidentes_por_100mil_vinculos
        tests: [not_null]

  - name: gold__aeat_subnotificacao
    description: >
      Acidentes com e sem CAT registrada pela contagem oficial do anuario, por
      CNAE e por recorte geografico. Mede a subnotificacao que os microdados da
      CAT, por definicao, nao conseguem revelar.
    columns:
      - name: ano
        tests: [not_null]
      - name: pct_sem_cat
        description: "Proporcao de acidentes reconhecidos sem CAT, em pontos percentuais"

  - name: gold__aeat_perfil
    description: >
      Acidentes por raca/cor e por nivel de instrucao, pelo anuario oficial, por
      pais, regiao e UF, com e sem CAT registrada. Unica fonte dessas dimensoes:
      os microdados publicos da CAT nao as trazem.
    columns:
      - name: ano
        tests: [not_null]
      - name: dimensao
        tests:
          - accepted_values:
              values: ['raca_cor', 'instrucao']
      - name: pct_sem_cat
        description: "Parcela dos acidentes do grupo reconhecidos sem CAT, em pontos percentuais"
      - name: pct_entre_informados
        description: "Participacao do grupo excluida a categoria Ignorada; nula na propria Ignorada"

  - name: gold__pnad_informalidade
    description: >
      Pessoas ocupadas e em situacao de informalidade pela PNAD Continua, por
      trimestre, UF e sexo, com os coeficientes de variacao do IBGE. Mede o
      trabalho que os denominadores formais nao alcancam.
    columns:
      - name: trimestre
        tests: [not_null]
      - name: ocupados_mil
        description: "Pessoas de 14 anos ou mais ocupadas, em milhares"
      - name: precisao_baixa
        description: "Coeficiente de variacao acima de 15% em alguma das estimativas"

  - name: gold__cobertura_denominador_uf
    description: >
      Vinculos ativos da RAIS por 100 pessoas ocupadas na PNAD do quarto
      trimestre, por UF e ano: aproximacao do alcance das taxas calculadas
      sobre o emprego formal.
    columns:
      - name: vinculos_por_100_ocupados
        description: "Razao entre vinculos e pessoas, nao proporcao; pode passar de 100; nula em 2020 e 2021"
        tests:
          - not_null:
              config:
                where: "ocupados_mil is not null"

  - name: gold__esaw_setor
    description: >
      Acidentes de trabalho por secao e divisao da NACE Rev. 2 nos paises
      europeus e agregados da UE (Eurostat ESAW), em numero e em taxa
      padronizada por 100 mil ocupados.
    columns:
      - name: ano
        tests: [not_null]
      - name: gravidade
        tests:
          - accepted_values:
              values: ['fatal', 'nao_fatal']

  - name: gold__comparacao_setorial_europa
    description: >
      Taxa de obitos por divisao de atividade, Brasil (CAT sobre vinculos RAIS)
      frente a UE-27 (ESAW), nos anos brasileiros consolidados.
    columns:
      - name: razao_brasil_ue27
        description: "Quantas vezes a taxa brasileira, um piso, supera a europeia"

  - name: gold__rotatividade_cnae
    description: >
      Rotatividade anual do emprego formal por classe CNAE (CAGED sobre
      vinculos RAIS), ao lado das taxas de acidentes e de obitos da mesma
      classe, nos anos com doze meses de CAGED.
    columns:
      - name: rotatividade_pct
        description: "Menor entre admissoes e desligamentos do ano por 100 vinculos; pode passar de 100"
        tests: [not_null]

  - name: gold__sim_obitos_trabalho_uf
    description: >
      Obitos por acidente de trabalho no SIM frente aos obitos com CAT, por UF
      e ano, com o preenchimento do campo acidtrab nas causas externas.
    columns:
      - name: pct_campo_preenchido
        description: "Causas externas com acidtrab sim ou nao, em pontos percentuais"
      - name: razao_sim_cat
        description: "Obitos de trabalho no SIM por obito com CAT; so comparavel em anos consolidados dos dois lados"

  - name: gold__sim_obitos_trabalho_perfil
    description: >
      Obitos por acidente de trabalho no SIM por causa, sexo, faixa etaria,
      raca/cor e familia ocupacional.

  - name: gold__incapacidade_grupo_uf
    description: >
      Concessoes por incapacidade temporaria e permanente por grupo de
      diagnostico, UF e ano, com a parcela acidentaria.
    columns:
      - name: pct_acidentaria
        description: "Concessoes com nexo com o trabalho reconhecido, em pontos percentuais"

  - name: gold__incapacidade_cid
    description: >
      Afastamentos temporarios por categoria CID-10 no pais, B31 frente a B91.

  - name: gold__prf_condutores_categoria
    description: >
      Condutores envolvidos em acidentes nas rodovias federais por categoria de
      veiculo, UF e ano, com obitos, feridos graves e letalidade.

  - name: gold__prf_caminhoneiros_horario
    description: >
      Condutores de caminhao envolvidos em acidentes por hora e dia da semana.

  - name: gold__trabalho_escravo_cadastro
    description: >
      Empregadores e trabalhadores do Cadastro de Empregadores, edicao mais
      recente, por UF, ano da acao fiscal e atividade.

  - name: gold__trabalho_escravo_edicoes
    description: "Totais de cada edicao do Cadastro de Empregadores carregada."

  - name: gold__aeat_indicadores_cnae
    description: >
      Indicadores oficiais do anuario por classe CNAE. A incidencia oficial vem
      por 1.000 vinculos e a coluna convertida para 100 mil existe para impedir
      comparacao entre escalas diferentes.
    columns:
      - name: cnae_codigo
        tests: [not_null]
      - name: incidencia_por_mil
        description: >
          Nulo e valor legitimo: o anuario grafa "-" para a classe CNAE sem
          ocorrencia no periodo, e 1.738 das linhas estao nessa situacao.

  - name: gold__comparacao_taxa_oficial
    description: >
      Confronto entre a taxa calculada pelo observatorio e a oficial. A razao
      entre elas e a subnotificacao medida no mesmo ano formam o argumento
      central sobre o alcance de uma serie construida so com CAT.
    columns:
      - name: ano
        tests: [not_null, unique]
      - name: razao_taxa
        tests: [not_null]
      - name: cobertura_cat_pct
        description: >
          Quanto do total oficial de CAT a serie do observatorio reproduz. Cai
          nos anos recentes porque a comunicacao do acidente continua chegando
          depois, e serve para nao atribuir a subnotificacao o que e defasagem.
